name: API and Web CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: farmago_test
          POSTGRES_USER: farmago
          POSTGRES_PASSWORD: farmago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmago -d farmago_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Run API unit and architecture tests
        run: bun run --cwd apps/api test
      - name: Build API
        run: bun run --cwd apps/api build
      - name: Run web unit tests
        run: bun run --cwd apps/web test
      - name: Build web
        run: bun run --cwd apps/web build
      - name: Apply PostgreSQL migrations for integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://farmago:farmago_test@localhost:5432/farmago_test
        run: bun src/interfaces/cli/migrate.ts
      - name: Run API PostgreSQL integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://farmago:farmago_test@localhost:5432/farmago_test
        run: bun run test:integration
